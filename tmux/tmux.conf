# Set prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Pane and window base index
set -g base-index 1
setw -g pane-base-index 1

# Terminal and color support
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Split panes in current path
bind _ split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

# Resize panes with Shift+HJKL
bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

# Navigate panes with hjkl
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Mouse and focus
set -g mouse on
set -g escape-time 0
set -g history-limit 10000
set -g focus-events on

# Copy mode (vi-style)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'



# Titles
set -g set-titles on
set -g set-titles-string '#(whoami)@#H - (#S:#W.#P)'
setw -g automatic-rename off

# Display panes
set -g display-panes-time 1000

# Status bar
set -g status-position top
set -g status-justify centre
set -g status-interval 10
set -g @ctp_rosewater "#f5e0dc"
set -g @ctp_flamingo "#f2cdcd"
set -g @ctp_pink "#f5c2e7"
set -g @ctp_mauve "#cba6f7"
set -g @ctp_red "#f38ba8"
set -g @ctp_peach "#fab387"
set -g @ctp_yellow "#f9e2af"
set -g @ctp_green "#a6e3a1"
set -g @ctp_teal "#94e2d5"
set -g @ctp_sky "#89dceb"
set -g @ctp_blue "#89b4fa"
set -g @ctp_lavender "#b4befe"
set -g @ctp_text "#cdd6f4"
set -g @ctp_subtext_1 "#bac2de"
set -g @ctp_subtext_0 "#a6adc8"
set -g @ctp_overlay_1 "#7f849c"
set -g @ctp_overlay_0 "#6c7086"
set -g @ctp_surface_2 "#585b70"
set -g @ctp_surface_1 "#45475a"
set -g @ctp_surface_0 "#313244"
set -g @ctp_base "#1e1e2e"
set -g @ctp_mantle "#181825"
set -g @ctp_crust "#11111b"
set -gF status-style "bg=#{@ctp_base},fg=#{@ctp_text}"
set -g status-left-length 80
set -g status-right-length 40

# Status left
set -g status-left "#{S:#{?#{==:#{session_name},#{client_session}},#[fg=#{@ctp_base} bg=#{@ctp_mauve} bold] #{session_name} #[fg=#{@ctp_mantle} bg=#{@ctp_base} nobold],#[fg=#{@ctp_subtext_0} bg=#{@ctp_mantle} nobold] #{session_name} #[fg=#{@ctp_mantle} bg=#{@ctp_base}] } }"

# Windows
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#{@ctp_subtext_0},bg=#{@ctp_mantle}] #I #[fg=#{@ctp_overlay_1}]#{=9:window_name} "
setw -g window-status-current-format "#[fg=#{@ctp_base},bg=#{@ctp_green},bold] #I #{=12:window_name} #[fg=#{@ctp_green},bg=#{@ctp_base},nobold,noitalics,nounderscore]"
setw -g window-status-activity-style "fg=#{@ctp_peach},bg=#{@ctp_base}"
setw -g window-status-bell-style "fg=#{@ctp_red},bg=#{@ctp_base},bold"

# Status right
set -g status-right "#[fg=#{@ctp_overlay_1}]#{b:pane_current_path}  #[fg=#{@ctp_surface_1}]|  #[fg=#{@ctp_peach}]%a %d %b  #[fg=#{@ctp_blue},bold]%H:%M  "

# Pane and message styling
set -gF pane-border-style "fg=#{@ctp_surface_2}"
set -gF pane-active-border-style "fg=#{@ctp_sky},bold"
set -g pane-border-status off
set -g pane-border-lines single
set -g pane-border-indicators off

# Dim inactive panes (active pane keeps normal colors)
set -gF window-style "fg=#{@ctp_overlay_1},bg=#{@ctp_mantle}"
set -gF window-active-style "fg=#{@ctp_text},bg=#{@ctp_base}"
set -gF message-style "fg=#{@ctp_base},bg=#{@ctp_peach},bold"
set -gF mode-style "fg=#{@ctp_base},bg=#{@ctp_blue},bold"

