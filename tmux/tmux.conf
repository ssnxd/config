# Set prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Pane and window base index
set -g base-index 1
setw -g pane-base-index 1

# Terminal and color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -ga terminal-overrides ",*256col*:RGB"
set -ga terminal-features ",xterm-ghostty:RGB:hyperlinks:usstyle:extkeys:clipboard"

# Modern terminal features
set -g allow-passthrough on      # images (yazi, chafa)
set -s extended-keys on          # kitty keyboard protocol
set -s set-clipboard on          # OSC 52 clipboard

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Split panes in current path
bind _ split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

# Resize panes with Shift+HJKL
bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

# Navigate panes with hjkl
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Mouse and focus
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on

# Copy mode (vi-style)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'



# Titles
set -g set-titles on
set -g set-titles-string '#(whoami)@#H - (#S:#W.#P)'
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# Display panes
set -g display-panes-time 1000

# Status bar
set -g status-position top
set -g status-justify centre
set -g status-interval 2
set -g @ctp_rosewater "#f5e0dc"
set -g @ctp_flamingo "#f2cdcd"
set -g @ctp_pink "#f5c2e7"
set -g @ctp_mauve "#cba6f7"
set -g @ctp_red "#f38ba8"
set -g @ctp_peach "#fab387"
set -g @ctp_yellow "#f9e2af"
set -g @ctp_green "#a6e3a1"
set -g @ctp_teal "#94e2d5"
set -g @ctp_sky "#89dceb"
set -g @ctp_blue "#89b4fa"
set -g @ctp_lavender "#b4befe"
set -g @ctp_text "#cdd6f4"
set -g @ctp_subtext_1 "#bac2de"
set -g @ctp_subtext_0 "#a6adc8"
set -g @ctp_overlay_1 "#7f849c"
set -g @ctp_overlay_0 "#6c7086"
set -g @ctp_surface_2 "#585b70"
set -g @ctp_surface_1 "#45475a"
set -g @ctp_surface_0 "#313244"
set -g @ctp_base "#1e1e2e"
set -g @ctp_mantle "#181825"
set -g @ctp_crust "#11111b"

# Session accent: one colour per session, set by scripts/tmux-session-color from
# tmux/session-colors. These globals are the fallback until the script has run.
set -g @accent "#cba6f7"
set -g @accent_bg "#2d2a40"
run-shell "$HOME/config/scripts/tmux-session-color"
set-hook -g session-created[10] 'run-shell "$HOME/config/scripts/tmux-session-color"'
set-hook -g session-renamed[10] 'run-shell "$HOME/config/scripts/tmux-session-color"'

set -g status-style "bg=default,fg=#{@ctp_text}"
set -g status-left-length 60
set -g status-right-length 200

# Status left: every session in its own colour, as a pill. The current session is
# solid and is followed by its window numbers. A window with a bell shows red with "!",
# a zoomed window shows "+". State markers follow: ^A (prefix), COPY, SYNC.
set -g status-left "#{S:#{?#{==:#{session_name},#{client_session}},#[fg=#{@accent} bg=default]#[fg=#{@ctp_crust} bg=#{@accent} bold]#{session_name}#[fg=#{@accent} bg=default nobold]#[default] #{W:#[range=window|#{window_index} fg=#{?window_bell_flag,#{@ctp_red},#{@accent}}] #{window_index}#{?window_bell_flag,!, }#[norange default],#[range=window|#{window_index} fg=#{@accent} bg=default]#[fg=#{@ctp_crust} bg=#{@accent} bold]#{window_index}#{?window_zoomed_flag,+,}#[fg=#{@accent} bg=default nobold]#[norange default]},#[fg=#{@ctp_surface_0} bg=default]#[fg=#{@accent} bg=#{@ctp_surface_0}]#{session_name}#[fg=#{@ctp_surface_0} bg=default]#[default]} }#{?client_prefix,#[fg=#{@ctp_peach} bold]^A #[default],}#{?pane_in_mode,#[fg=#{@ctp_yellow} bold]COPY #[default],}#{?pane_synchronized,#[fg=#{@ctp_red} bold]SYNC #[default],}"

# Windows: shown in status-left, so the centre list stays empty
setw -g window-status-separator ""
setw -g window-status-format ""
setw -g window-status-current-format ""

# Status right: session > project > pane title, without the leading status symbol.
# The project is left out when it equals the session name. A plain shell shows its
# command in place of the host name. The title shrinks with the terminal width and
# is left out when it is only a path, which is what an idle shell sets.
# The agentbar indicator leads it: filled when a Claude session needs you.
set -g status-right "#{E:@agentbar_pill}#[fg=#{@accent} bg=default]#[fg=#{@ctp_crust} bg=#{@accent} bold]#{session_name}#[nobold]#{?#{==:#{session_name},#{b:pane_current_path}},, #[fg=#{@ctp_surface_2}]›#[fg=#{@ctp_crust}] #{b:pane_current_path}}#{?#{e|>=:#{client_width},90},#{?#{m/r:^[/~],#{pane_title}},, #[fg=#{@ctp_surface_2}]›#[fg=#{@ctp_crust}] #{=/#{e|-:#{client_width},70}/…:#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{s|^[^a-zA-Z0-9]*||:pane_title}}}},}#[fg=#{@accent} bg=default]"

# Pane and message styling
set -gF pane-border-style "fg=#{@ctp_surface_2}"
set -g pane-active-border-style "fg=#{@accent},bold"
set -g pane-border-status off
set -g pane-border-lines single
set -g pane-border-indicators off

# Dim inactive panes (active pane gets the session tint)
set -gF window-style "fg=#{@ctp_overlay_1},bg=#{@ctp_mantle}"
set -g window-active-style "fg=#{@ctp_text},bg=#{@accent_bg}"
set -g message-style "fg=#{@ctp_crust},bg=#{@accent},bold"
set -gF mode-style "fg=#{@ctp_base},bg=#{@ctp_blue},bold"

# vim: set syntax=tmux:

# agentbar: running Claude Code sessions. Indicator in status-right, search
# popup on prefix a or a click on the indicator, sidebar on prefix A.
# options (set -g before the run-shell line): @agentbar-key, @agentbar-focus-key,
# @agentbar-sidebar-key, @agentbar-side left/right, @agentbar-width N
set -g @agentbar-cap-left ""
set -g @agentbar-cap-right ""
set -g @agentbar-accent "#{@accent}"
run-shell "$HOME/.local/bin/agentbar tmux-init"
