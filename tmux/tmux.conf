# Set prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Pane and window base index
set -g base-index 1
setw -g pane-base-index 1

# Terminal and color support
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Split panes in current path
bind _ split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

# Resize panes with Shift+HJKL
bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

# Navigate panes with hjkl
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Mouse and focus
set -g mouse on
set -g escape-time 0
set -g history-limit 10000
set -g focus-events on

# Copy mode (vi-style)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# --- Theme and Appearance ---
# Theme colors are loaded from theme.conf (symlinked by setup.sh based on SYSTEM_THEME)
source-file ~/.tmux/theme.conf

# Titles
set -g set-titles on
set -g set-titles-string '#(whoami)@#H - (#S:#W.#P)'

# Display panes
set -g display-panes-time 1000

# Windows
setw -g window-status-separator "  "

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-interval 60
set -g status-left ''
set -g status-left-length 0
set -g status-right-length 100

